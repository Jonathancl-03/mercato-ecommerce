<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda - Mercato</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { display: ['Fraunces','serif'], sans: ['Inter','sans-serif'] },
      colors: { stone:{50:'#F7F5F1',100:'#E2DED5'}, forest:{600:'#2D4A3E',700:'#233A30'}, mustard:{500:'#C9A227'}, ink:{900:'#1C1F26'} }
    }}
  }
</script>
<style>
  body{font-family:'Inter',sans-serif}
  .glass-pill{background:linear-gradient(145deg,rgba(45,74,62,.06),rgba(45,74,62,.02));border:1px solid rgba(45,74,62,.1)}
  .dark .glass-pill{background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1)}
</style>
</head>
<body class="antialiased bg-stone-50 dark:bg-ink-900 text-ink-900 dark:text-white">

<script>
  if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark')}
</script>

<header class="sticky top-0 z-40 bg-stone-50/90 dark:bg-ink-900/90 backdrop-blur-lg border-b-2 border-forest-600">
  <div class="max-w-7xl mx-auto px-4 flex items-center justify-between py-4">
    <a href="index.html" class="font-display text-2xl font-semibold text-forest-600">Mercato</a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
      <a href="index.html" class="hover:text-forest-600">Inicio</a>
      <a href="tienda.html" class="hover:text-forest-600">Tienda</a>
    </nav>
    <div class="flex items-center gap-4">
      <button onclick="toggleTheme()" class="w-10 h-10 rounded-full glass-pill flex items-center justify-center">🌓</button>
      <span class="relative">
        <button onclick="toggleCart()" class="w-10 h-10 rounded-full glass-pill flex items-center justify-center">🛒</button>
        <span id="cart-badge" class="absolute -top-1 -right-1 bg-mustard-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center hidden"></span>
      </span>
    </div>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 py-10">
  <div class="mb-10 text-center">
    <h1 class="font-display text-4xl font-semibold text-forest-600">Nuestro catálogo</h1>
    <p class="text-ink-900/50 dark:text-white/50 mt-2">Demo interactiva — el carrito se guarda en tu navegador</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="productos"></div>
</div>

<!-- Panel de carrito -->
<div id="cart-panel" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/50" onclick="toggleCart()"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-sm bg-white dark:bg-ink-900 p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="font-display text-2xl font-semibold">Mi carrito</h2>
      <button onclick="toggleCart()" class="text-ink-900/50 dark:text-white/50">✕</button>
    </div>
    <div id="cart-items" class="space-y-4"></div>
    <div class="mt-6 pt-4 border-t border-stone-100 dark:border-white/10 flex justify-between font-bold">
      <span>Total</span>
      <span id="cart-total" class="text-mustard-500">S/ 0.00</span>
    </div>
    <p class="text-xs text-ink-900/40 dark:text-white/30 mt-4 text-center">
      Esto es una demostración — no procesa pagos reales.
    </p>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
